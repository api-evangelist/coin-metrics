aid: coin-metrics
url: https://raw.githubusercontent.com/api-evangelist/coin-metrics/refs/heads/main/apis.yml
name: Coin Metrics
kind: company
description: 'Coin Metrics is a Boston-based crypto financial intelligence provider founded in 2017, selling
  institutional-grade cryptoasset network (on-chain) data, exchange market data (trades, quotes, order
  books, candles, derivatives), CMBI indexes, reference rates, and reference/security-master data. Everything
  is delivered through a single documented API v4 - REST at api.coinmetrics.io/v4 and WebSocket streaming
  at wss://api.coinmetrics.io/v4 as paid, API-key products - plus a free, keyless Community API at community-api.coinmetrics.io/v4
  under a CC BY-NC 4.0 license, with flat files, Python and R clients, and Google Sheets as additional
  delivery channels. A complete OpenAPI 3.0.2 definition is published on the docs site. Coin Metrics is
  now part of Talos: coinmetrics.io 301-redirects to talos.com/our-solutions/data/overview, while docs.coinmetrics.io
  and the api/community-api hosts remain live under the Coin Metrics brand.'
