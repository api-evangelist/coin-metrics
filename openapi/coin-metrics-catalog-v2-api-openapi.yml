  parameters:
    MarketType:
      description: Type of markets.
      in: query
      name: type
      schema:
        enum:
        - spot
        - future
        - option
        type: string
    CatalogResponseFormat:
      description: Format of the response. Supported values are `json`, `json_stream`.
      in: query
      name: format
      schema:
        type: string
        default: json
    StartTime:
      description: 'Start of the time interval.<br/> This field refers to the `time` field in the response.<br/> Multiple formats of ISO 8601 are supported: `2006-01-20T00:00:00Z`, `2006-01-20T00:00:00.000Z`, `2006-01-20T00:00:00.123456Z`, `2006-01-20T00:00:00.123456789Z`, `2006-01-20`, `20060120`.<br/> Inclusive by default.<br/> UTC timezone by default. `Z` suffix is optional and `timezone` parameter has a priority over it.<br/> If `start_time` is omitted, response will include time series from the **earliest** time available.'
      in: query
      name: start_time
      schema:
        type: string
    PageSize:
      description: Number of items per single page of results.<br/> The value of this parameter is ignored if the endpoint supports the `format` parameter and its value is set to `json_stream`.
      in: query
      name: page_size
      schema:
        default: 100
        type: integer
        format: int32
        minimum: 1
        maximum: 10000
    EndTime:
      description: 'End of the time interval.<br/> This field refers to the `time` field in the response.<br/> Multiple formats of ISO 8601 are supported: `2006-01-20T00:00:00Z`, `2006-01-20T00:00:00.000Z`, `2006-01-20T00:00:00.123456Z`, `2006-01-20T00:00:00.123456789Z`, `2006-01-20`, `20060120`.<br/> Inclusive by default.<br/> UTC timezone by default. `Z` suffix is optional and `timezone` parameter has a priority over it.<br/> If `end_time` is omitted, response will include time series up to the **latest** time available.'
      in: query
      name: end_time
      schema:
        type: string
    MarketQuote:
      description: Quote asset of markets.
      in: query
      name: quote
      schema:
        type: string
    Reviewable:
      description: Limit to human-reviewable metrics. By default all metrics are returned.
      in: query
      name: reviewable
      schema:
        type: boolean
    CatalogIndexId:
      description: Comma separated list of indexes. By default all indexes are returned.
      in: query
      name: indexes
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogMetric:
      description: Comma separated list of metrics. By default all metrics are returned.
      in: query
      name: metrics
      schema:
        type: array
        items:
          type: string
      explode: false
    MarketSymbol:
      description: Symbol of derivative markets, full instrument name.
      in: query
      name: symbol
      schema:
        type: string
    MarketBase:
      description: Base asset of markets.
      in: query
      name: base
      schema:
        type: string
    CatalogAssetId:
      description: 'Comma separated list of assets. By default all assets are returned. Supports the following formats: `<asset>` - Coin Metrics asset ticker (e.g., `btc`), `<namespace>:<symbol>` - External provider symbol (e.g., `talos:BTC`), `<namespace>:by-id:<id>` - External provider numeric ID (e.g., `talos:by-id:24`). The `namespace` identifies the external data provider (e.g., `talos`). The `by-id` selector indicates lookup by a provider-specific numeric ID rather than symbol.'
      in: query
      name: assets
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogMarketId:
      description: Comma separated list of markets. By default all markets are returned.
      in: query
      name: markets
      schema:
        type: array
        items:
          type: string
      explode: false
    MarketAsset:
      description: Any asset of markets.
      in: query
      name: asset
      schema:
        type: string
    Pretty:
      description: Human-readable formatting of JSON responses.
      in: query
      name: pretty
      schema:
        type: boolean
        default: false
    Protocols:
      description: Comma separated list of protocols like `aave_v3` or `morpho_blue`.
      in: query
      name: protocols
      schema:
        type: array
        items:
          type: string
      explode: false
    PagingFromWithStartByDefault:
      description: Where does the first page start, at the start of the interval or at the end.<br/> The value of this parameter is ignored if the endpoint supports the `format` parameter and its value is set to `json_stream`.
      in: query
      name: paging_from
      schema:
        default: start
        enum:
        - start
        - end
        type: string
        format: PagingFrom
    Timezone:
      description: Timezone name for `start_time` and `end_time` timestamps.<br/> This parameter does not modify the output times, which are always `UTC`.<br/> Format is defined by [TZ database](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
      in: query
      name: timezone
      schema:
        example: America/New_York
        default: UTC
        type: string
    ProtocolMetrics:
      description: Comma separated list of protocol metrics like `supply_apy`.
      in: query
      name: metrics
      schema:
        type: array
        items:
          type: string
      explode: false
    StartInclusive:
      description: Inclusive or exclusive corresponding `start_*` parameters.
      in: query
      name: start_inclusive
      schema:
        default: true
        type: boolean
    EndInclusive:
      description: Inclusive or exclusive corresponding `end_*` parameters.
      in: query
      name: end_inclusive
      schema:
        default: true
        type: boolean
    Exchange:
      description: Unique name of an exchange.
      in: query
      name: exchange
      schema:
        type: string
    CatalogPairId:
      description: Comma separated list of asset pairs. By default, all asset pairs are returned.
      in: query
      name: pairs
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogExchangeAssetId:
      description: Comma separated list of exchange-assets. By default, all exchange-assets pairs are returned.
      in: query
      name: exchange_assets
      schema:
        type: array
        items:
          type: string
      explode: false
    ProtocolMarkets:
      description: Comma separated list of protocol markets like `core-weth` or `steakusdc`.
      in: query
      name: markets
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogExchangeId:
      description: 'Comma separated list of exchanges. By default all exchanges are returned. Supports the following formats: `<exchange>` - Coin Metrics exchange name (e.g., `binance`), `<namespace>:<name>` - External provider market name (e.g., `talos:binance`), `<namespace>:by-id:<id>` - External provider numeric market ID (e.g., `talos:by-id:1003`). The `namespace` identifies the external data provider (e.g., `talos`). The `by-id` selector indicates lookup by numeric ID rather than name.'
      in: query
      name: exchanges
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogInstitutionId:
      description: Comma separated list of institutions. By default, all institutions are returned.
      in: query
      name: institutions
      schema:
        type: array
        items:
          type: string
      explode: false
    ProtocolChains:
      description: Comma separated list of protocol chains like `ethereum` or `base`.
      in: query
      name: chains
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogExchangePairId:
      description: Comma separated list of exchange-pairs. By default, all exchange-pairs are returned.
      in: query
      name: exchange_pairs
      schema:
        type: array
        items:
          type: string
      explode: false
    NextPageToken:
      description: Token for receiving the results from the next page of a query.<br/> Should not be used directly. To iterate through pages just use `next_page_url` response field.
      in: query
      name: next_page_token
      schema:
        type: string
  securitySchemes:
    api_key:
      description: Coin Metrics API key can be specified as `?api_key=` query parameter.
      in: query
      name: api_key
      type: apiKey
