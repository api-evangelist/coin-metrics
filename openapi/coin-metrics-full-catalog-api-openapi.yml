      description: List of implied volatility statistics.
      content:
        application/json:
          example:
            data:
            - market: deribit-BTC-15OCT21-60000-C-option
              min_time: '2022-01-26T08:00:00.001000000Z'
              max_time: '2022-04-11T08:00:00.000000000Z'
