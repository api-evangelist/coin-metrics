            - market: binance-1000LUNCBUSD-future
              min_time: '2022-05-31T02:00:00.000000000Z'
              max_time: '2022-07-04T13:00:00.000000000Z'
            - market: binance-1000SHIBUSDT-future
              min_time: '2021-11-10T22:00:00.000000000Z'
