            $ref: '#/components/schemas/CatalogMarketImpliedVolatilityResponse'
  parameters:
    MarketType:
      description: Type of markets.
      in: query
      name: type
      schema:
        enum:
        - spot
        - future
        - option
        type: string
    CatalogResponseFormat:
      description: Format of the response. Supported values are `json`, `json_stream`.
      in: query
      name: format
      schema:
        type: string
        default: json
    CatalogAssetAlertId:
      description: Comma separated list of asset alert names. By default all asset alerts are returned.
      in: query
      name: alerts
      schema:
        type: array
        items:
          type: string
      explode: false
    MarketQuote:
      description: Quote asset of markets.
      in: query
      name: quote
      schema:
        type: string
    Reviewable:
      description: Limit to human-reviewable metrics. By default all metrics are returned.
      in: query
      name: reviewable
      schema:
        type: boolean
    CatalogMarketLimit:
      description: Limit of response items. `none` means no limit. Maximum value is 100.
      in: query
      name: limit
      schema:
        type: string
        default: none
    CatalogIndexId:
      description: Comma separated list of indexes. By default all indexes are returned.
      in: query
      name: indexes
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogMetric:
      description: Comma separated list of metrics. By default all metrics are returned.
      in: query
      name: metrics
      schema:
        type: array
        items:
          type: string
      explode: false
    MarketSymbol:
      description: Symbol of derivative markets, full instrument name.
      in: query
      name: symbol
      schema:
        type: string
    MarketBase:
      description: Base asset of markets.
      in: query
      name: base
      schema:
        type: string
    CatalogAssetId:
      description: 'Comma separated list of assets. By default all assets are returned. Supports the following formats: `<asset>` - Coin Metrics asset ticker (e.g., `btc`), `<namespace>:<symbol>` - External provider symbol (e.g., `talos:BTC`), `<namespace>:by-id:<id>` - External provider numeric ID (e.g., `talos:by-id:24`). The `namespace` identifies the external data provider (e.g., `talos`). The `by-id` selector indicates lookup by a provider-specific numeric ID rather than symbol.'
      in: query
      name: assets
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogMarketId:
      description: Comma separated list of markets. By default all markets are returned.
      in: query
      name: markets
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogMarketExcludeFields:
      description: Comma separated list of fields to exclude from response. Supported values are `trades`, `orderbooks`, `quotes`, `funding_rates`, `openinterest`, `liquidations`. Included by default if omitted.
      in: query
      name: exclude
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogAssetIncludeFields:
      description: Comma separated list of fields to include in response. Supported values are `metrics`, `markets`, `exchanges`. Included by default if omitted.
      in: query
      name: include
      schema:
        type: array
        items:
          type: string
      explode: false
    MarketAsset:
      description: Any asset of markets.
      in: query
      name: asset
      schema:
        type: string
    Pretty:
      description: Human-readable formatting of JSON responses.
      in: query
      name: pretty
      schema:
        type: boolean
        default: false
    CatalogAssetExcludeFields:
      description: Comma separated list of fields to exclude from response. Supported values are `metrics`, `markets`, `exchanges`. Included by default if omitted.
      in: query
      name: exclude
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogMarketIncludeFields:
      description: Comma separated list of fields to include in response. Supported values are `trades`, `orderbooks`, `quotes`, `funding_rates`, `openinterest`, `liquidations`. Included by default if omitted.
      in: query
      name: include
      schema:
        type: array
        items:
          type: string
      explode: false
    Exchange:
      description: Unique name of an exchange.
      in: query
      name: exchange
      schema:
        type: string
    CatalogPairId:
      description: Comma separated list of asset pairs. By default, all asset pairs are returned.
      in: query
      name: pairs
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogExchangeAssetId:
      description: Comma separated list of exchange-assets. By default, all exchange-assets pairs are returned.
      in: query
      name: exchange_assets
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogExchangeId:
      description: 'Comma separated list of exchanges. By default all exchanges are returned. Supports the following formats: `<exchange>` - Coin Metrics exchange name (e.g., `binance`), `<namespace>:<name>` - External provider market name (e.g., `talos:binance`), `<namespace>:by-id:<id>` - External provider numeric market ID (e.g., `talos:by-id:1003`). The `namespace` identifies the external data provider (e.g., `talos`). The `by-id` selector indicates lookup by numeric ID rather than name.'
      in: query
      name: exchanges
      schema:
        type: array
        items:
          type: string
      explode: false
    CatalogInstitutionId:
      description: Comma separated list of institutions. By default, all institutions are returned.
      in: query
      name: institutions
      schema:
        type: array
        items:
          type: string
      explode: false
  securitySchemes:
    api_key:
      description: Coin Metrics API key can be specified as `?api_key=` query parameter.
      in: query
      name: api_key
      type: apiKey
