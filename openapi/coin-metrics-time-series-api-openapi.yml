        - volatility_implied_skew_delta_05_1d_expiration
        type: array
        items:
          type: string
      explode: false
    ExchangeAssetMetricsFrequency:
      description: Frequency of the exchange-asset metrics. Supported values are `5m`, `1h`, `1d`.
      in: query
      name: frequency
      schema:
        default: 1d
        type: string
    ImpliedVolatilityGranularity:
      description: Downsampling granularity of market implied volatility. Supported values are `raw`, `1m`, `1h`, and `1d`.
      in: query
      name: granularity
      schema:
        default: raw
        type: string
        enum:
        - raw
        - 1m
        - 1h
        - 1d
    StartTime:
      description: 'Start of the time interval.<br/> This field refers to the `time` field in the response.<br/> Multiple formats of ISO 8601 are supported: `2006-01-20T00:00:00Z`, `2006-01-20T00:00:00.000Z`, `2006-01-20T00:00:00.123456Z`, `2006-01-20T00:00:00.123456789Z`, `2006-01-20`, `20060120`.<br/> Inclusive by default.<br/> UTC timezone by default. `Z` suffix is optional and `timezone` parameter has a priority over it.<br/> If `start_time` is omitted, response will include time series from the **earliest** time available.'
      in: query
      name: start_time
      schema:
        type: string
    ExchangeMetricsFrequency:
      description: Frequency of the exchange metrics. Supported values are `1h`, `1d`.
      in: query
      name: frequency
      schema:
        default: 1d
        type: string
    ProtocolMarkets:
      description: Comma separated list of protocol markets like `core-weth` or `steakusdc`.
      in: query
      name: markets
      schema:
        type: array
        items:
          type: string
      explode: false
    LimitPerExchangePair:
      description: How many entries per exchange_pair result should contain. For example, this combination of parameters `exchange_pairs=binance-btc-usdt,coinbase-eth-usd&metrics=volatility_implied_skew_delta_05_1d_expiration&limit_per_exchange_pair=1` returns the latest `volatility_implied_skew_delta_05_1d_expiration` values for `binance-btc-usdt` and `coinbase-eth-usd`.
      in: query
      name: limit_per_exchange_pair
      schema:
        type: integer
        format: int32
    Sort:
      description: How results will be sorted. Metrics with `1b` frequency are sorted by `(asset, height, block_hash)` tuples by default. Metrics with other frequencies are sorted by `(asset, time)` by default. If you want to sort `1d` metrics by `(time, asset)` you should choose `time` as value for the `sort` parameter.<br/> Sorting by `time` is useful if you request metrics for a set of assets.
      in: query
      name: sort
      schema:
        default: asset
        enum:
        - asset
        - height
        - time
        type: string
    InstitutionSort:
      description: 'How results will be sorted. Metrics are sorted by `(institution, time)` by default. If you want to sort `1d` metrics by `(time, institution)` you should choose `time` as value for the `sort` parameter.<br/> Sorting by `time` is useful if you request metrics for a set of institutions.<br/> Note: sorting by `time` is not supported when wildcards are used.'
      in: query
      name: sort
      schema:
        default: institution
        enum:
        - institution
        - time
        type: string
    ExchangeSort:
      description: How results will be sorted. Metrics are sorted by `(exchange, time)` by default. If you want to sort `1d` metrics by `(time, exchange)` you should choose `time` as value for the `sort` parameter.<br/> Sorting by `time` is useful if you request metrics for a set of exchanges.
      in: query
      name: sort
      schema:
        default: exchange
        enum:
        - exchange
        - time
        type: string
    Pretty:
      description: Human-readable formatting of JSON responses.
      in: query
      name: pretty
      schema:
        type: boolean
        default: false
    ProtocolMetrics:
      description: Comma separated list of protocol metrics like `supply_apy`.
      in: query
      name: metrics
      schema:
        type: array
        items:
          type: string
      explode: false
    OrderBookStartWithSnapshot:
      description: Applies only when `dataset=updates`.<br/><br/> When `false` (default), rows are returned from the exact readable range. This is useful when the order book state is already initialized so the timestamp of the last row received can be used to resume downloading order book data.<br/><br/> When `true`, the response starts with a snapshot row when one is available at or before the effective dataset start. This is useful for order book state initialization. The API may include a snapshot from before `start_time` so client state can be initialized before the first update row is applied.<br/><br/> This parameter is ignored when `dataset=snapshots`.
      in: query
      name: start_with_snapshot
      schema:
        type: boolean
        default: false
