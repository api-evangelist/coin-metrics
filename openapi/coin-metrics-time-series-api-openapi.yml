      name: metrics
      required: true
      schema:
        example:
        - volume_trusted_spot_usd_1h
        - volume_trusted_spot_usd_1d
        type: array
        items:
          type: string
      explode: false
    PairMetricsFrequency:
      description: Frequency of the pair metrics. Supported values are `1h`, `1d`.
      in: query
      name: frequency
      schema:
        default: 1d
        type: string
    MarketOrderBooksAndQuotesGranularity:
      description: Downsampling granularity of market order books and quotes. Supported values are `raw`, `1m`, `1h`, and `1d`.
      in: query
      name: granularity
      schema:
        default: raw
        type: string
        enum:
        - raw
        - 1m
        - 1h
        - 1d
    GreeksGranularity:
      description: Downsampling granularity of market greeks. Supported values are `raw`, `1m`, `1h`, and `1d`.
      in: query
      name: granularity
      schema:
        default: raw
        type: string
        enum:
        - raw
        - 1m
        - 1h
        - 1d
    ExchangePairs:
      description: Comma separated list of exchange-pairs or patterns like `exchange-*` or `*-pair`.
      in: query
      name: exchange_pairs
      required: true
      schema:
        type: array
        items:
          type: string
      explode: false
    InstitutionMetricsParam:
      description: Comma separated metrics to request time series data for.<br/> Information on all available metrics can be found on page https://docs.coinmetrics.io/market-data/market-data-overview/institution-metrics-overview.<br/> Use the [/catalog-all-v2/institution-metrics](#operation/getCatalogAllV2InstitutionMetrics) endpoint for the full list of supported metrics per institution.
      in: query
      name: metrics
      required: true
      schema:
        example:
        - btc_total_assets
        - btc_shares_outstanding
        type: array
        items:
          type: string
      explode: false
    LimitPerPairCandle:
      description: How many entries per pair result should contain.
      in: query
      name: limit_per_pair
      schema:
        type: integer
        format: int32
    IncludeVerification:
      description: If set to true, includes information about verification.
      in: query
      name: include_verification
      required: false
      schema:
        type: boolean
        default: false
    ResponseFormat:
      description: Format of the response. Supported values are `json`, `json_stream`, `csv`.
      in: query
      name: format
      schema:
        enum:
        - json
        - json_stream
        - csv
        type: string
        default: json
