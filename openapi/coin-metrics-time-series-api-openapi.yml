    OrderBookDataset:
      description: "Logical order book dataset to return.<br/><br/> `snapshots` (default) returns snapshot rows only.<br/><br/> `updates` returns Book Streams snapshot/update rows for migrated exchanges.<br/><br/> Caveats:<br/> <ul>\n    <li>`dataset=updates` is currently supported for `full_book` and `30000` depths, `raw` granularity, `json_stream` format, `paging_from=start`, and migrated exchanges only.</li>\n    <li>When the `updates` dataset is requested, there are no guarantees on how snapshots are placed inside the data. Snapshots can appear at arbitrary timestamps and at irregular intervals.</li>\n    <li>Clients should reset their order book state on every snapshot row, not only on the first one. Snapshots may be emitted mid-stream, for example when the upstream feed is switched, and can carry book state that differs from prior updates. Treating every snapshot as a full state replacement is always safe while skipping snapshots is not.</li>\n    <li>When the `updates` dataset is requested, the response may contain redundant snapshots that do not change order book state and are there for state synchronization. Such redundant snapshots have the same timestamp and `coin_metrics_id` as the previous row. Clients may use this to detect redundant snapshots, but the safe default is still to reset state on every snapshot.</li>\n</ul>"
      in: query
      name: dataset
      schema:
        type: string
        enum:
        - snapshots
        - updates
        default: snapshots
