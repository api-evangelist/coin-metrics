  openapiProvenance: |
    openapi/coin-metrics-api-v4-openapi.json was downloaded verbatim on
    2026-07-21 from https://docs.coinmetrics.io/api/static/openapi.json (HTTP
    200, ~1.2 MB), the same document the public ReDoc reference at
    https://docs.coinmetrics.io/api/v4 links as "openapi.json"/"openapi.yaml".
    OpenAPI 3.0.2, info.title "Coin Metrics API v4", info.version 4.0.0, 203
    paths, servers https://api.coinmetrics.io/v4, wss://api.coinmetrics.io/v4,
    and https://community-api.coinmetrics.io/v4. Nothing was modified.
  commercialPosture: |
    Public pricing page exists (coinmetrics.io/pricing) but paid API access is
    obtained via sales contact/demo rather than self-serve key issuance; the
    free Community API requires no signup at all. Docs are fully public with
    no login wall, including the machine-readable spec, an llms.txt index, and
    per-page Markdown exports.
sources:
  - url: https://docs.coinmetrics.io/api/v4
    type: APIReference
    note: Public ReDoc reference for API v4; documents API-key auth and both HTTPS and wss roots, plus the keyless community root.
  - url: https://docs.coinmetrics.io/api/static/openapi.json
    type: OpenAPI
    note: Downloadable OpenAPI 3.0.2 definition harvested into openapi/.
  - url: https://docs.coinmetrics.io/access-our-data
    type: Documentation
    note: Lists REST/HTTP API, WebSocket API, Python and R clients, flat files, and Coverage front-end as access methods.
  - url: https://coinmetrics.io/community-network-data/
    type: Documentation
    note: Community data program behind the free CC BY-NC 4.0 community API.
  - url: https://github.com/coinmetrics
    type: GitHubOrganization
    note: Hosts the open-source Python API client (api-client-python) and other tooling.
