aid: coin-metrics
name: Coin Metrics
review:
  question: Does Coin Metrics expose a documented, publicly accessible API surface?
  answer: true
  date: '2026-07-21'
  reviewer: API Evangelist
findings:
  summary: |
    Coin Metrics has one of the stronger public API postures among institutional
    market data vendors. The entire product line (network/on-chain data, exchange
    market data, CMBI indexes, reference rates, Atlas blockchain explorer,
    security master, taxonomy) is exposed through a single documented API v4,
    rendered as a public ReDoc reference at https://docs.coinmetrics.io/api/v4
    backed by a downloadable OpenAPI 3.0.2 definition (203 paths). The paid tier
    uses simple API-key authentication (an api_key query parameter, per the
    spec's single securityScheme) at https://api.coinmetrics.io/v4,
    with WebSocket streaming at wss://api.coinmetrics.io/v4 - keys are obtained
    through sales contact rather than self-serve signup, so the pro tier is
    sales-gated even though its documentation is fully public. A free Community
    API at https://community-api.coinmetrics.io/v4 requires no key at all
    (CC BY-NC 4.0 license) and was confirmed live during this review. Additional
    documented delivery channels are flat files, Python and R API clients, and
    Google Sheets integration. Coin Metrics remains an independent company
    (founded 2017, Boston); no acquisition/parent to record.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.coinmetrics.io/v4
      documented: true
      note: Paid product; API key required. Unauthenticated probe of /catalog/assets returned HTTP 401 (live, auth-gated).
    - protocol: REST
      scheme: https
      baseURL: https://community-api.coinmetrics.io/v4
      documented: true
      note: Free community tier, no API key. /catalog/assets and /timeseries/asset-metrics?assets=btc&metrics=PriceUSD both returned HTTP 200.
    - protocol: WebSocket
      scheme: wss
      baseURL: wss://api.coinmetrics.io/v4
      documented: true
      note: Paid product. Eleven /timeseries-stream/* channels in the OpenAPI definition (asset metrics, trades, quotes, order books, candles, open interest, liquidations, contract prices, pair/asset quotes, index levels). Not probed (requires API key).
    - protocol: FlatFiles
      scheme: https
      documented: true
      note: Docs "Access Our Data" page lists flat files alongside the REST and WebSocket APIs; front-end and Google Sheets download paths documented under access-our-data/downloading-our-data.
